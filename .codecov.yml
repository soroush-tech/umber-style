comment:
  layout: 'header, diff, flags, files,  components'
  behavior: default # Add a comment on every PR with updated coverage
  require_changes: false # Always show comment, even if no coverage change

# patch only scores changed lines, so a PR that touches only one package contributes no
# patch lines for the other flags (and carryforward covers any flag that didn't upload) -
# listing every flag keeps each package's patch gated without penalising untouched ones.
# project is intentionally left at its default (target: auto): component_management already
# owns per-component project statuses.
coverage:
  status:
    patch:
      default:
        flags:
          # gen:codecov-patch-flags start - regenerated by `pnpm gen:publish-options`; do not edit by hand
          - cache
          - core
          - css
          - eslint-config
          - is-prop-valid
          - react
          - react-native
          - server
          - styled
          - umber-style
          - vue
          # gen:codecov-patch-flags end

# Carry the last known report forward so a flag that didn't upload on a commit keeps
# its coverage instead of dropping to "No report uploaded". paths map each flag to the
# files it covers.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    # gen:codecov-flags start - regenerated by `pnpm gen:publish-options`; do not edit by hand
    - name: cache
      paths:
        - packages/cache/
    - name: core
      paths:
        - packages/core/
    - name: css
      paths:
        - packages/css/
    - name: eslint-config
      paths:
        - packages/eslint-config/
    - name: is-prop-valid
      paths:
        - packages/is-prop-valid/
    - name: react
      paths:
        - packages/react/
    - name: react-native
      paths:
        - packages/react-native/
    - name: server
      paths:
        - packages/server/
    - name: styled
      paths:
        - packages/styled/
    - name: umber-style
      paths:
        - packages/umber-style/
    - name: vue
      paths:
        - packages/vue/
    # gen:codecov-flags end

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - '!main'
  individual_components:
    # gen:codecov-components start - regenerated by `pnpm gen:publish-options`; do not edit by hand
    - component_id: cache
      name: cache
      paths:
        - packages/cache/**
    - component_id: core
      name: core
      paths:
        - packages/core/**
    - component_id: css
      name: css
      paths:
        - packages/css/**
    - component_id: eslint-config
      name: eslint-config
      paths:
        - packages/eslint-config/**
    - component_id: is-prop-valid
      name: is-prop-valid
      paths:
        - packages/is-prop-valid/**
    - component_id: react
      name: react
      paths:
        - packages/react/**
    - component_id: react-native
      name: react-native
      paths:
        - packages/react-native/**
    - component_id: server
      name: server
      paths:
        - packages/server/**
    - component_id: styled
      name: styled
      paths:
        - packages/styled/**
    - component_id: umber-style
      name: umber-style
      paths:
        - packages/umber-style/**
    - component_id: vue
      name: vue
      paths:
        - packages/vue/**
    # gen:codecov-components end
