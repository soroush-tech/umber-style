# Every job installs through this action, so editing it re-runs every one of them - and, being a
# CI file rather than a root file, ships nothing.
#
# The four steps every CI job used to repeat, minus the checkout: a local action is
# resolved from the working tree, so `uses: ./.github/actions/setup` cannot carry the
# checkout that puts it there. Jobs keep their own.
#
# Per-area caches stay in the jobs that need them. This holds only what every job shares,
# so bumping the pnpm pin or changing the store cache is an edit to this file alone.
name: Setup
description: Set up pnpm and Node, then install the workspace's dependencies.

inputs:
  node_version:
    description: Node.js version to install - ci.yml's `prepare` job reads it from .nvmrc.
    required: true
  manager:
    description: Detected package manager - pnpm, yarn or npm.
    required: true
  command:
    description: The manager's install command, with its flags.
    required: true
  registry_url:
    description: The registry setup-node writes into .npmrc - the release workflow passes npm's; every other job leaves it empty.
    required: false
    default: ''
  react:
    description: A React 19 minor (`19.0`) or version (`19.0.9`) to pin across the workspace before the install (scripts/use-react.mjs), in this checkout only - ci.yml's React axis passes it; every other job leaves it empty and installs the lockfile's React.
    required: false
    default: ''
  next:
    description: A Next.js 16 minor (`16.0`) or version (`16.0.11`) to pin across the workspace before the install (scripts/use-next.mjs), in this checkout only - ci.yml's Next.js axis passes it on the rows of the App Router fixture; every other job leaves it empty and installs the lockfile's Next.js.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      if: inputs.manager == 'pnpm'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.manager }}
        registry-url: ${{ inputs.registry_url }}

    # A root `pnpm.overrides` for react and react-dom, written into this checkout only and never
    # committed. Node is set up by now, so the script runs on the repository's Node.
    - name: Pin React
      if: inputs.react != ''
      shell: bash
      env:
        REACT: ${{ inputs.react }}
      run: node scripts/use-react.mjs "$REACT"

    # The same for `next`: a root `pnpm.overrides`, in this checkout only.
    - name: Pin Next.js
      if: inputs.next != ''
      shell: bash
      env:
        NEXT: ${{ inputs.next }}
      run: node scripts/use-next.mjs "$NEXT"

    # The inputs reach the shell through env and a fixed dispatch, never spliced into
    # the run body - zizmor: template-injection. `$COMMAND` is deliberately unquoted: it
    # is a flag list ("install --frozen-lockfile --ignore-scripts"), not a single word.
    # With React or Next.js pinned the lockfile no longer matches, so that install may update it.
    - name: Install dependencies
      shell: bash
      env:
        CI: true
        MANAGER: ${{ inputs.manager }}
        COMMAND: ${{ inputs.command }}
        REACT: ${{ inputs.react }}
        NEXT: ${{ inputs.next }}
      run: |
        if [ -n "$REACT$NEXT" ]; then COMMAND="${COMMAND/--frozen-lockfile/--no-frozen-lockfile}"; fi
        case "$MANAGER" in
          pnpm|yarn|npm) "$MANAGER" $COMMAND ;;
          *) echo "Unsupported package manager: $MANAGER" >&2; exit 1 ;;
        esac

    # Every workspace member that resolves react or react-dom has the pinned version.
    - name: Check the installed React
      if: inputs.react != ''
      shell: bash
      run: node scripts/use-react.mjs --check

    # Every workspace member that resolves next has the pinned version.
    - name: Check the installed Next.js
      if: inputs.next != ''
      shell: bash
      run: node scripts/use-next.mjs --check
