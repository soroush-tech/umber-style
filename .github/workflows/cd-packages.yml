# CI never runs this workflow, so nothing proves it works short of dispatching it: see docs/releasing.md.
name: CD - Packages (npm)

# Publishes the non-private packages to npm via Trusted Publishing (OIDC): a single named
# package, or `all` - every non-private package whose current version isn't on the registry yet.
# Manual dispatch only - never from a push, PR merge, or CI completion. A release is a deliberate
# act with in-repo notes; auth is a short-lived id-token minted per run and verified against the
# trusted publisher configured on npm (workflow cd-packages.yml, environment cd-packages): there
# is no long-lived token.
#
# The channel decides what goes out (docs/releasing.md). package.json always holds the target
# version; scripts/prerelease-versions.mjs turns it into the published one:
#   alpha  - <target>-alpha.N under the `alpha` dist-tag, from any branch whose commit passed
#            CI, so a change can be tried in real apps before it merges. No GitHub Release.
#   rc     - <target>-rc.N under `rc`, from main. A GitHub pre-release.
#   stable - <target> under `latest`, from main. A GitHub Release.
# N counts up from what npm already has; a prerelease never touches `latest`.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (`all` = every package with an unpublished version)
        required: true
        type: choice
        # gen:publish-options start - regenerated by `pnpm gen:publish-options`; do not edit by hand
        options:
          - all
          - cache
          - core
          - css
          - is-prop-valid
          - react
          - react-native
          - server
          - styled
          - umber-style
          - vue
        # gen:publish-options end
      channel:
        description: Release channel (`alpha` from a CI-passed branch; `rc` and `stable` from main)
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - rc
          - stable

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cd-packages
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing (no NPM_TOKEN)
      contents: write # create the GitHub Release and its tag
      checks: read # read the commit's ci-ok result for an alpha
    steps:
      # rc and stable come off main only. An alpha may come off any branch, but only a commit
      # whose CI finished green: ci-ok is the single required check of ci.yml, and a branch
      # without a PR has no CI run, so it can't publish.
      - name: Check the branch and CI
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" != "alpha" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] \
              || { echo "::error::$CHANNEL publishes from main only, not $GITHUB_REF"; exit 1; }
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.status == "completed")][0].conclusion // "none"')
          [ "$conclusion" = "success" ] \
            || { echo "::error::ci-ok on $GITHUB_SHA is '$conclusion' - an alpha needs green CI (open a PR and let it pass)"; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Resolve the dispatch input to the list of packages this run publishes: the one named
      # package, or - for `all` - every non-private directory under packages/. The choice list is
      # generated from packages/ (scripts/gen-publish-options.mjs), but a named package is still
      # validated here as defense-in-depth: only non-private packages may publish. $PKG is read
      # from env (never spliced into the shell) to avoid injection. Release notes come from an
      # in-repo file (packages/<pkg>/release-notes/<version>.md): one is required for every
      # resolved package here, before anything is built or published, so a release can never ship
      # without notes and npm is never touched when any are missing.
      - name: Resolve packages
        env:
          PKG: ${{ inputs.package }}
        run: |
          if [ "$PKG" = "all" ]; then
            PKGS=$(node -e '
              const { readdirSync, existsSync, readFileSync } = require("node:fs")
              const names = readdirSync("packages", { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => entry.name)
                .filter((name) => existsSync(`packages/${name}/package.json`))
                .filter((name) => JSON.parse(readFileSync(`packages/${name}/package.json`, "utf8")).private !== true)
                .sort()
              console.log(names.join(" "))
            ')
          else
            test -f "packages/$PKG/package.json" || { echo "::error::Unknown package: $PKG"; exit 1; }
            node -e 'process.exit(JSON.parse(require("node:fs").readFileSync(`packages/${process.env.PKG}/package.json`, "utf8")).private === true ? 1 : 0)' \
              || { echo "::error::$PKG is private - not publishable"; exit 1; }
            PKGS="$PKG"
          fi
          for pkg in $PKGS; do
            VERSION=$(PKG="$pkg" node -e 'console.log(JSON.parse(require("node:fs").readFileSync(`packages/${process.env.PKG}/package.json`, "utf8")).version)')
            test -f "packages/$pkg/release-notes/$VERSION.md" \
              || { echo "::error::Missing release notes: packages/$pkg/release-notes/$VERSION.md"; exit 1; }
          done
          echo "PKGS=$PKGS" >> "$GITHUB_ENV"

      - name: Read Node.js version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # --ignore-scripts, as everywhere in CI/CD: no lifecycle script runs at install - the
      # packages build with tsdown, which needs none. The registry is npm's own; NODE_AUTH_TOKEN
      # stays unset, so the publish below authenticates by OIDC only.
      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ steps.node-version.outputs.version }}
          manager: pnpm
          command: install --frozen-lockfile --ignore-scripts
          registry_url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm CLI 11.5.1 or later (and Node 22.14.0 or later):
      # https://docs.npmjs.com/trusted-publishers. `pnpm publish` hands the upload to the npm on
      # PATH, so that is the one that must be new enough. Node's own npm is, as a rule; if it is
      # not, take the newest 11.x, and check again.
      - name: Ensure an npm CLI that can publish by OIDC
        run: |
          ok() {
            node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
          }
          ok || npm install --global --ignore-scripts npm@11
          ok || { echo "::error::npm $(npm --version) is older than 11.5.1, which Trusted Publishing needs"; exit 1; }
          echo "npm $(npm --version), node $(node --version)"

      # Turn the package.json targets into this channel's versions (in this checkout only) and
      # order the run dependencies-first. With `all`, a target already on npm is skipped; a
      # named one fails. The release notes were checked for the target version above.
      - name: Set channel versions
        id: versions
        env:
          CHANNEL: ${{ inputs.channel }}
          PKG: ${{ inputs.package }}
        run: |
          SKIP=""
          [ "$PKG" = "all" ] && SKIP="--skip-released"
          node scripts/prerelease-versions.mjs "$CHANNEL" $SKIP $PKGS >> "$GITHUB_ENV"

      # Build every package and prove the packed result works from outside the workspace, before
      # anything reaches npm: tarballs of the channel's versions, installed together, imported,
      # server-rendered and type-checked (scripts/smoke-packed.mjs). A failure here publishes
      # nothing. `pnpm publish` builds each package again through its prepublishOnly script.
      - name: Build and smoke-test the packed packages
        run: |
          pnpm build
          node scripts/smoke-packed.mjs

      # Publish each resolved package via npm Trusted Publishing (OIDC). Auth comes from the
      # id-token minted above - there is no NPM_TOKEN, and NODE_AUTH_TOKEN must stay unset (even
      # an empty value makes pnpm use token auth instead of falling back to OIDC). Skip a version
      # already on the registry rather than fail trying to republish it - with `all`, that skip is
      # the filter: only packages whose version isn't on npm yet actually publish. Bump a package
      # version on main to release it. Each package runs in a subshell so a skip exits only that
      # iteration and cd resets; a real publish failure stops the loop, because the packages after it
      # depend on it (dependencies come first), and fails the step. Rerun to finish: what is already
      # on npm is skipped.
      - name: Publish packages
        id: publish
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          unset NODE_AUTH_TOKEN
          # The explicit `|| exit 1` guards are load-bearing: with the subshell on the left of
          # `||`, bash ignores errexit inside it, so failures must be raised by hand for the
          # failure handling to see them.
          # npm puts an untagged version on `latest`, which every consumer installs - so a
          # prerelease always goes out under its channel's dist-tag.
          tag=latest
          [ "$CHANNEL" != "stable" ] && tag="$CHANNEL"
          # The first version of a package on npm becomes `latest` whatever its tag, so a prerelease
          # of a package with no release on `latest` would reach every user. Check them all before
          # anything is published.
          if [ "$CHANNEL" != "stable" ]; then
            unreleased=""
            for pkg in $PKGS; do
              name=$(node -p "require('./packages/$pkg/package.json').name") || exit 1
              latest=$(npm view --prefer-online "$name" dist-tags.latest 2>/dev/null) || latest=""
              case "$latest" in
                "" | *-*)
                  echo "::error::$name has no release on \`latest\` (it is '${latest:-none}'): the first version published becomes \`latest\` whatever its tag. Publish the 0.0.0 placeholder for it first (docs/releasing.md)."
                  unreleased="$unreleased $pkg" ;;
                *) ;;
              esac
            done
            [ -z "$unreleased" ] || exit 1
          fi
          failed=""
          for pkg in $PKGS; do
            (
              cd "packages/$pkg" || exit 1
              name=$(node -p "require('./package.json').name") || exit 1
              version=$(node -p "require('./package.json').version") || exit 1
              # --prefer-online throughout: npm caches a package's metadata for minutes, and a
              # copy cached before this publish would hide the version it just published.
              if npm view --prefer-online "$name@$version" version >/dev/null 2>&1; then
                echo "Skipped: \`$name@$version\` is already on npm (bump the version to release)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              pnpm publish --no-git-checks --tag "$tag" || exit 1
              # A prerelease on `latest` would hand it to every user: stop loudly.
              latest=$(npm view --prefer-online "$name" dist-tags.latest 2>/dev/null)
              case "$latest" in *-*)
                echo "::error::$name latest is now $latest - move it back with npm dist-tag"; exit 1 ;;
              *) ;; # a release, or the 0.0.0 placeholder, on `latest`: as it should be
              esac
              echo "### Published \`$name@$version\` (\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
              echo "https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Published::$name@$version"
            ) || { echo "::error::Publishing $pkg failed"; failed="$failed $pkg"; break; }
          done
          if [ -n "$failed" ]; then
            echo "::error::Publish failed for:$failed"
            exit 1
          fi

      # Create each package's GitHub Release if it doesn't already exist - gated on the release's
      # existence, not on whether npm was newly published in this run, so a rerun can repair a
      # missing release after a successful publish. Runs even when the previous step failed
      # (`!cancelled()`) so packages that did publish still get their release; a version that
      # never made it to npm is skipped rather than released - and, after a clean publish, fails
      # the step. No release for an alpha: it is a trial, not a release.
      # Notes come from the in-repo file packages/<pkg>/release-notes/<version>.md (its existence
      # was checked in the Resolve step, before publish); --notes-file reads it verbatim. $pkg
      # comes from the resolved list (repo directory names), never spliced from the dispatch input.
      - name: Create GitHub Releases
        # Only after the versions were set: a failed version step leaves package.json at the
        # target, which must never be released under this channel. A publish failure still
        # reaches here, so packages that did publish get their release.
        if: ${{ !cancelled() && inputs.channel != 'alpha' && steps.versions.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          # An rc is a GitHub pre-release and never "Latest". --target pins the tag to the
          # published commit. The notes are the target version's file (0.2.0.md for 0.2.0-rc.1).
          flags=""
          [ "$CHANNEL" = "rc" ] && flags="--prerelease --latest=false"
          for pkg in $PKGS; do
            name=$(PKG="$pkg" node -p "require('./packages/'+process.env.PKG+'/package.json').name")
            version=$(PKG="$pkg" node -p "require('./packages/'+process.env.PKG+'/package.json').version")
            tag="$name@$version"
            # Ask the registry, not npm's cache - the Publish step's lookups cached this package's
            # metadata from before the publish. The registry can take minutes to list a fresh
            # version, so after a clean publish wait up to ten; after a failed one the version may
            # never come, so a minute is enough.
            attempts=60
            [ "$PUBLISH_OUTCOME" = "success" ] || attempts=6
            found=""
            for _ in $(seq "$attempts"); do
              npm view --prefer-online "$name@$version" version >/dev/null 2>&1 && { found=1; break; }
              sleep 10
            done
            if [ -z "$found" ]; then
              echo "Skipped: \`$tag\` is not on npm - no GitHub Release created." >> "$GITHUB_STEP_SUMMARY"
              if [ "$PUBLISH_OUTCOME" = "success" ]; then
                echo "::error::$tag was published but is not on the registry yet - rerun to create its Release."
                missing=1
              fi
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Skipped: GitHub Release \`$tag\` already exists." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" $flags \
              --notes-file "packages/$pkg/release-notes/${version%%-*}.md"
            echo "### Released \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -z "$missing" ] || exit 1
