name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect node version / package manager once and build the package matrix, then
  # expose everything as outputs the other jobs reuse via needs.prepare.outputs.*
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      node_version: ${{ steps.node-version.outputs.version }}
      manager: ${{ steps.detect-package-manager.outputs.manager }}
      command: ${{ steps.detect-package-manager.outputs.command }}
      runner: ${{ steps.detect-package-manager.outputs.runner }}
      packages: ${{ steps.discover.outputs.packages }}
      playwright_version: ${{ steps.detect-playwright.outputs.version }}
      fixtures: ${{ steps.discover-fixtures.outputs.fixtures }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Node.js version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # Every install runs --ignore-scripts: no lifecycle script at install time,
      # anywhere in CI.
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile --ignore-scripts" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile --non-interactive --ignore-scripts" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci --ignore-scripts" >> $GITHUB_OUTPUT
            echo "runner=npm" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      # One matrix row per package. The Codecov flag is the folder name, which is also what
      # `pnpm gen:publish-options` writes into .codecov.yml. A new package appears here without
      # this file being touched.
      - name: Discover package matrix
        id: discover
        run: |
          MATRIX=$(node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs")
            const rows = readdirSync("packages", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .filter((dir) => existsSync(`packages/${dir}/package.json`))
              .sort()
              .map((dir) => {
                const pkg = JSON.parse(readFileSync(`packages/${dir}/package.json`, "utf8"))
                return { dir, filter: pkg.name, flag: dir }
              })
            console.log(JSON.stringify({ include: rows }))
          ')
          echo "packages=$MATRIX" >> "$GITHUB_OUTPUT"

      # The Playwright cache key needs the version; whichever package declares playwright is the
      # one whose browser tier runs it. The e2e package declares @playwright/test, pinned to the
      # same version, so one browser download serves both tiers.
      - name: Read Playwright version from packages
        id: detect-playwright
        run: |
          VERSION=$(node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs")
            for (const dir of readdirSync("packages")) {
              const manifest = `packages/${dir}/package.json`
              if (!existsSync(manifest)) continue
              const pkg = JSON.parse(readFileSync(manifest, "utf8"))
              const version = pkg.devDependencies?.playwright ?? pkg.dependencies?.playwright
              if (version) { console.log(version.replace(/^\^/, "")); break }
            }
          ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One e2e row per fixture app under fixtures/. `shared` holds the components every fixture
      # renders, not an app. Fixtures live outside packages/, so they are not in the package matrix.
      - name: Discover fixture matrix
        id: discover-fixtures
        run: |
          MATRIX=$(node -e '
            const { readdirSync, existsSync } = require("node:fs")
            const rows = readdirSync("fixtures", { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && entry.name !== "shared")
              .filter((entry) => existsSync(`fixtures/${entry.name}/package.json`))
              .map((entry) => ({ fixture: entry.name }))
              .sort((a, b) => a.fixture.localeCompare(b.fixture))
            console.log(JSON.stringify({ include: rows }))
          ')
          echo "fixtures=$MATRIX" >> "$GITHUB_OUTPUT"

  # Format + lint + typecheck the whole workspace once (cheap, recursive).
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      # Formatting is enforced here, not by a lint rule: oxfmt owns it.
      - name: Run Format Check
        run: ${{ needs.prepare.outputs.runner }} run format:check

      - name: Run Lint
        run: ${{ needs.prepare.outputs.runner }} run lint

      - name: Run Typecheck
        run: ${{ needs.prepare.outputs.runner }} run typecheck

      # Fail the build if the generated package config (.codecov.yml, the issue forms'
      # "Affected area" lists, the label-area allowlist) has drifted from packages/.
      - name: Check generated package config
        run: ${{ needs.prepare.outputs.runner }} run gen:publish-options --check

      # Fail the build on invisible characters, typographic punctuation or mojibake in any
      # tracked text file. ASCII punctuation is the house rule.
      - name: Check typography
        run: ${{ needs.prepare.outputs.runner }} run check:typography

      # Every publishable package has a release-notes file for its current version, so a version
      # bump cannot reach main without its notes (cd-packages.yml refuses to publish without them).
      - name: Check release notes
        run: ${{ needs.prepare.outputs.runner }} run check:release-notes

  # One row per package: install, run its `test:coverage`, upload its lcov under its
  # own Codecov flag. Packages are alike, so they are a matrix rather than a job each.
  packages:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # tokenless OIDC Codecov upload
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      - name: Run Tests with Coverage
        run: ${{ needs.prepare.outputs.runner }} --filter ${{ matrix.filter }} test:coverage

      # vitest writes lcov paths relative to the member (e.g. SF:src/index.ts), which is
      # ambiguous across the monorepo - Codecov can't map a lone src/index.ts and silently
      # drops the flag's coverage. Prefix with the member's own directory so paths are
      # repo-relative and unique. Via env (never spliced into the shell).
      - name: Make lcov paths repo-relative for Codecov
        env:
          DIR: ${{ matrix.dir }}
        run: sed -i "s#^SF:#SF:packages/$DIR/#" "packages/$DIR/coverage/lcov.info"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./packages/${{ matrix.dir }}/coverage/lcov.info
          slug: soroush-tech/umber-style
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}

  # What a pull request must prove about publishing: the packages build, and the packed
  # tarballs work together from outside the workspace (import, require, the export conditions, a
  # server render, the declarations under two module resolutions). The smoke test installs from npm.
  build:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      - name: Build the packages
        run: ${{ needs.prepare.outputs.runner }} run build

      - name: Smoke-test the packed packages
        run: node scripts/smoke-packed.mjs

  # Tier 2 of docs/testing.md: the engine's own output in real headless Chromium, in the packages that
  # have a `test:browser` script. The default test and coverage runs above need no browser.
  browser:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - filter: '@umber-style/core'
          - filter: '@umber-style/react'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      # After the install, which touches nothing on this path.
      - name: Restore cache - Playwright binaries
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      # Only Chromium is needed - the browser tier runs headless Chromium.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.filter }} exec playwright install --with-deps chromium

      # On a cache hit the binaries are restored, but Linux system libs live outside the cache.
      # A stalled package mirror once held this step for ten minutes and failed the job: each
      # attempt stops after three minutes, and the third failure fails the step. timeout stops
      # pnpm, not the apt-get it started as root, which keeps apt's lock and failed every attempt
      # after the first: a failed attempt stops it too, lets dpkg finish what it began, and the next
      # apt waits for a lock still held rather than failing at once.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/90-lock-timeout > /dev/null
          for attempt in 1 2 3; do
            timeout 180 pnpm --filter "$FILTER" exec playwright install-deps chromium && exit 0
            echo "::warning::Playwright system deps, attempt $attempt of 3 failed"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Save cache - Playwright binaries
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      - name: Run real-browser tests
        run: ${{ needs.prepare.outputs.runner }} --filter ${{ matrix.filter }} test:browser

  # Tier 3 of docs/testing.md: one row per fixture app. Each is built, served as in production, and
  # driven by Playwright Test. A test marked as a known failure is an expected failure: it does not
  # fail the run, but one that starts to pass does, so the mark gets removed.
  e2e:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.fixtures) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
      E2E_FIXTURE: ${{ matrix.fixture }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      # Same pinned browser location and key as the browser job, so both tiers share one download.
      - name: Restore cache - Playwright binaries
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @umber-fixtures/e2e exec playwright install --with-deps chromium

      # Same attempts as the browser job.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/90-lock-timeout > /dev/null
          for attempt in 1 2 3; do
            timeout 180 pnpm --filter @umber-fixtures/e2e exec playwright install-deps chromium && exit 0
            echo "::warning::Playwright system deps, attempt $attempt of 3 failed"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Save cache - Playwright binaries
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      # The Playwright config builds and serves the fixture named by E2E_FIXTURE.
      - name: Run end-to-end tests
        run: ${{ needs.prepare.outputs.runner }} run test:e2e
        env:
          CI: true

  # The development tier of docs/testing.md: the fixtures that have a development server, each started with
  # its own `dev` script and driven by Playwright Test (hydration, strict mode, hot replacement, the
  # development checker, navigation). The rows are the fixtures with a `devPort` in e2e/fixtures.ts.
  e2e-dev:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [vike-ssg, next-app, spa]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
      E2E_FIXTURE: ${{ matrix.fixture }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      # Same pinned browser location and key as the browser job, so both tiers share one download.
      - name: Restore cache - Playwright binaries
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @umber-fixtures/e2e exec playwright install --with-deps chromium

      # Same attempts as the browser job.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/90-lock-timeout > /dev/null
          for attempt in 1 2 3; do
            timeout 180 pnpm --filter @umber-fixtures/e2e exec playwright install-deps chromium && exit 0
            echo "::warning::Playwright system deps, attempt $attempt of 3 failed"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Save cache - Playwright binaries
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.prepare.outputs.playwright_version }}

      # The Playwright config starts the development server of the fixture named by E2E_FIXTURE.
      - name: Run end-to-end tests against development servers
        run: ${{ needs.prepare.outputs.runner }} run test:e2e:dev
        env:
          CI: true

  # The benchmark gate of docs/benchmarks.md: the gate files in bench/gate run in the pinned Docker sandbox
  # of soroush-bench (soroush-tech/bench-action), each comparing the build of this checkout (`local`) with
  # the published release the baseline tag names (`previous`, installed from npm inside the sandbox). A
  # case below the minimum speed ratio fails the job and, through ci-ok, the pull request. If the
  # baseline cannot be installed the sandbox run fails, so the job fails: it never passes without a
  # comparison.
  bench:
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # bench-action posts/updates the results comment
      id-token: write # OIDC token for the branded comment relay (api.bench.soroush.tech)
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ needs.prepare.outputs.node_version }}
          manager: ${{ needs.prepare.outputs.manager }}
          command: ${{ needs.prepare.outputs.command }}

      # The gate files import the built dist of the packages, so the comparison against the npm
      # release's prebuilt dist is like-for-like.
      - name: Build the packages
        run: ${{ needs.prepare.outputs.runner }} run build

      # Mint a token from the org's GitHub App so the results comment is posted under the brand bot
      # identity instead of github-actions[bot]. Skipped (and the gate falls back to GITHUB_TOKEN)
      # when the app isn't configured.
      - name: Mint bot token
        id: bot-token
        if: vars.BENCH_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BENCH_BOT_APP_ID }}
          private-key: ${{ secrets.BENCH_BOT_PRIVATE_KEY }}
          # Scope the minted token to commenting only, instead of inheriting every
          # permission the app installation has.
          permission-pull-requests: write

      - name: Run benchmark gate
        # Our own action, pinned like any other: `v1` is a tag, and a tag moves.
        uses: soroush-tech/bench-action@b527ad437545189516e36ee3c29f6aeb09c3557e # v1.1.1
        with:
          bench-dir: bench/gate
          baseline-case: previous
          min-ratio: '80'
          # Median of 5 rounds per file: the README's recommendation for shared runners.
          rounds: '5'
          github-token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [prepare, lint, packages, build, browser, e2e, e2e-dev, bench]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled."
          exit 1
